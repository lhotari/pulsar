# The alert fan-out of iot-alerts-fanout.yaml across many topics: the platform keeps a topic for each of 1,000 sites,
# and 10 backend applications each consume every site's alerts through a Shared subscription of their own, with four
# worker pods that each subscribe to all of the topics. The gateways publish 5,000 alerts per second in all, five per
# site, with deduplication on, so the broker carries 5,000 producers with deduplication state, 10,000 subscriptions
# and 40,000 consumers of light traffic each: it measures the per-topic, per-producer and per-consumer overhead.
extends: iot-alerts-fanout.yaml
workloads:
  iotTelemetry:
    gateways:
      count: 5
      producer:
        precreateConcurrency: 64
    topics:
      count: 1000
    applications:
      count: 10
      podsPerApplication: 4
    timeoutSeconds: 360
