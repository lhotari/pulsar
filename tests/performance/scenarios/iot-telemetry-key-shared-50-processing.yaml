# Controlled-rate variant with deterministic processing-time variance and a 3% long tail.
extends: iot-telemetry-key-shared-50.yaml
workloads:
  iotTelemetry:
    durationSeconds: 120
    rate: 1000
    numberOfMessages: 120000
    processingDelayMeanMicros: 2000
    processingDelayStdDevMicros: 500
    processingDelayOutlierProbability: 0.03
    processingDelayOutlierMeanMicros: 50000
    processingDelayOutlierStdDevMicros: 20000
output:
  directory: build/performance/iot-telemetry-key-shared-50-processing
