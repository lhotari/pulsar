# The packets from the brokers to the gateways are lost for 10 s of the measurement while the gateways' packets still
# arrive, as an asymmetric routing failure does: the brokers receive and persist the messages, but their receipts
# don't reach the gateways. Look for: the producers' resends after the path comes back, deduplication of the resent
# messages, duplicates delivered to the applications, and ordering.

network:
  impairments:
    brokers-to-gateways-lost:
      from: brokers
      to: gateways
      partition: true
      start: 30s
      duration: 10s
