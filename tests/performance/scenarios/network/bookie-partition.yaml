# One bookie is cut off from the brokers for 30 s of the measurement, in the failover cluster, as a bookie whose host
# loses its network does. Look for: the brokers replacing the bookie in the ensembles of the open ledgers, the publish
# latency while they do, and correct delivery.

extends: failover-cluster.yaml
network:
  impairments:
    bookie-0-cut-off:
      between: [brokers, bookie-0]
      partition: true
      start: 30s
      duration: 30s
