# A broker is cut off from the clients for 30 s of the measurement, in the failover cluster, while it still reaches the
# other broker, the bookies and ZooKeeper, as a load balancer or a firewall between the clients and one broker would do.
# The broker keeps its topics. Look for: the clients' reconnections, the producers' pending messages and resends,
# duplicates and ordering, and how long the backlog takes to drain after it.

extends: failover-cluster.yaml
network:
  impairments:
    broker-1-clients-cut-off:
      between: [clients, broker-1]
      partition: true
      start: 30s
      duration: 30s
