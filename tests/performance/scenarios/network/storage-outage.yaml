# Every bookie is cut off from the brokers for 20 s of the measurement, in the failover cluster, as in a storage network
# outage. The publishes wait for the bookies, and the producers' sends queue up to their limit of outstanding messages.
# On iot-telemetry-small, publishing resumed about 7 s after the bookies came back, a 27 s stall for a 20 s outage,
# probably because the brokers' TCP connections to the bookies retransmit with exponential backoff while the packets
# are dropped, so that the first retransmission after the outage comes seconds after it ends. With
# --set network.impairments.storage-outage.duration=45s, past the bookie client's 30 s timeout, publishing resumed
# about 12 s after the bookies came back, a 57 s stall, and every message was still delivered once and in order.
# Look for: the stall against the outage, the
# bookie client's timeout (bookkeeperClientTimeoutInSeconds, 30 s) for a longer outage, and correct delivery.

extends: failover-cluster.yaml
network:
  impairments:
    storage-outage:
      between: [brokers, bookies]
      partition: true
      start: 30s
      duration: 20s
workloads:
  iotTelemetry:
    gateways:
      env:
        PULSAR_CLIENT_LOG_LEVEL: info
