# One bookie is on a degraded link: 20 ms one way between it and the brokers, for the whole run, in the failover cluster
# with an ack quorum of 2 of 3. Look for: whether the ack quorum hides the slow bookie from the publish latency, and the
# bookie's own queues. Compare with --set cluster.brokers.env.managedLedgerDefaultAckQuorum=3, where every entry waits
# for it.

extends: failover-cluster.yaml
network:
  impairments:
    slow-bookie-0:
      between: [brokers, bookie-0]
      delay: 20ms
