# The clients' TCP connections disappear without the brokers knowing, as when a NAT gateway or a firewall in front of
# the clients forgets its connections, or a client's host drops off the network: the gateways' connections at 30 s of
# the measurement, and the applications' at 100 s. The clients get an error at once and reconnect, on new connections,
# while their resets are dropped, so that the brokers keep the old connections, with the producers and consumers on
# them, until the brokers' keep-alive finds them dead, in 30-60 s with the default 30 s interval. The old connections'
# packets stay dropped until the run ends.
#
# On iot-telemetry-small, the gateways reconnected within about a second. After the applications' disconnection, the
# broker held each Key_Shared consumer twice, the old one and its replacement, and its 512 MB heap ran out about 15 s
# later: it restarted, and the publish latency reached 20-34 s. Add --extends configs/heap-dumps-broker for a heap
# dump at the OutOfMemoryError. Look for: the brokers' consumers and heap, how long the brokers keep the old
# connections, and the clients' pulsar-client.log.txt.

network:
  impairments:
    gateways-gone:
      from: gateways
      to: brokers
      silentDisconnect: true
      start: 30s
    applications-gone:
      from: applications
      to: brokers
      silentDisconnect: true
      start: 100s
workloads:
  iotTelemetry:
    measurement:
      seconds: 180
    timeoutSeconds: 360
    gateways:
      env:
        PULSAR_CLIENT_LOG_LEVEL: info
    applications:
      env:
        PULSAR_CLIENT_LOG_LEVEL: info
