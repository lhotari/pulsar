# Key_Shared under consumer churn: like iot-telemetry-key-shared-replay.yaml, but each application has 100 pods,
# restarts a tenth of them every 10 seconds, as a rolling deployment that replaces pods in batches does, and doesn't
# pause any, and the pods acknowledge a message two seconds after receiving it, so that every consumer holds pending
# acknowledgments. A pod that rejoins takes hashes that another consumer still drains, so the subscriptions' replay
# queues hold the positions of draining hashes. It measures the dispatcher's work on consumer additions and removals
# and on draining hashes.
extends: iot-telemetry-key-shared-replay.yaml
workloads:
  iotTelemetry:
    applications:
      podsPerApplication: 100
      ackDelayMillis: 2000
    behaviors:
      podPauses:
        intervalSeconds: 0
      podRestarts:
        intervalSeconds: 10
        fraction: 0.1
